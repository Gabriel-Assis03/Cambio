{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Cambio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    {% block css %}{% endblock %}
</head>
<body>
    <header class="header">
        <a class="brand" href="{% url 'home-page' %}">Cambio</a>
        <a class="home-link" href="{% url 'home-page' %}" aria-label="Ir para a página inicial">
            <img src="{% static 'img/house-icon.png' %}" alt="">
        </a>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
